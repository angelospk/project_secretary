# Service-mode deploy: SurrealDB (persistent) + the secretary poll loop, with the
# console, one-shot tools, and an opt-in auto-updater behind profiles.
#
# Image source (pick one in .env):
#   - Pull a published release (default): SECRETARY_IMAGE/SECRETARY_TAG → ghcr.io.
#       docker compose pull && docker compose up -d
#   - Build from source (no registry): set SECRETARY_TAG=local, then:
#       docker compose build && docker compose up -d
#
# Worked example: find_doctors_server (see deploy/README.md). Copy deploy/.env.example
# to deploy/.env, fill it, then bring it up.
name: secretary

# Shared base for every secretary service: same image, build context, env, and DB dep.
x-secretary: &secretary
  image: ${SECRETARY_IMAGE:-ghcr.io/angelospk/project-secretary}:${SECRETARY_TAG:-0.2}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  depends_on: [surreal]

services:
  surreal:
    image: surrealdb/surrealdb:v2
    command:
      - start
      - --user
      - ${SECRETARY_SURREAL_USER:-root}
      - --pass
      - ${SECRETARY_SURREAL_PASS:-root}
      - surrealkv:///data/secretary.db
    volumes:
      - surreal-data:/data
    restart: unless-stopped
    # Deliberately NOT watchtower-labeled: a DB major bump is a manual decision.

  # The poll loop: reconcile + auto-embed + plan maintenance every
  # SECRETARY_POLL_INTERVAL_SECONDS. Runs ensure_schema each cycle (auto-migrate).
  secretary-run:
    <<: *secretary
    command: ["run"]
    restart: unless-stopped
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  # One-shot first population: docker compose run --rm secretary-backfill
  secretary-backfill:
    <<: *secretary
    command: ["backfill"]
    profiles: ["tools"]

  # Optional read-mostly console on 127.0.0.1:8088 (needs SECRETARY_CONSOLE_HOST=0.0.0.0
  # in .env). Enable: docker compose --profile console up -d
  secretary-console:
    <<: *secretary
    command: ["console"]
    ports:
      - "127.0.0.1:8088:8088"
    profiles: ["console"]
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  # Opt-in auto-update: polls the registry hourly and pulls+restarts only the
  # watchtower-labeled secretary services when the tracked tag moves. Not started
  # unless you ask: docker compose --profile autoupdate up -d
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --label-enable --interval 3600
    restart: unless-stopped
    profiles: ["autoupdate"]

volumes:
  surreal-data:
