{% extends "base.html" %}
{% block content %}
<h2>Admin login</h2>
{% if error %}<p style="color:#c44">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="card">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autofocus>
  <button type="submit">Log in</button>
</form>
<p class="muted">Lost the password? Reset <code>SECRETARY_CONSOLE_PASSWORD</code> in the
environment and restart — you control the box that runs this.</p>
{% endblock %}
